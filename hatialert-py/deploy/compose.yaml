# HatiAlert behind Caddy (automatic HTTPS from Let's Encrypt).
#
#   cp .env.example .env     # then edit .env
#   docker compose up -d --build
#
# Only Caddy is reachable from outside (ports 80 and 443). The app listens on
# port 8000 inside the Compose network only.
name: hatialert

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  hatialert:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: hatialert:local
    restart: unless-stopped
    environment:
      HATIALERT_DEMO: ${HATIALERT_DEMO:-0}
      HATIALERT_BACKUP_HOURS: ${HATIALERT_BACKUP_HOURS:-24}
      HATIALERT_BACKUP_KEEP: ${HATIALERT_BACKUP_KEEP:-14}
      HATIALERT_SMS_URL: ${HATIALERT_SMS_URL:-}
      HATIALERT_SMS_AUTH: ${HATIALERT_SMS_AUTH:-}
      HATIALERT_SMS_BODY: ${HATIALERT_SMS_BODY:-}
      HATIALERT_SMS_PREFIX: ${HATIALERT_SMS_PREFIX-+91}
      HATIALERT_SMS_DEBUG: ${HATIALERT_SMS_DEBUG:-0}
    volumes:
      - hatialert_data:/data
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *logging

  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    depends_on:
      hatialert:
        condition: service_healthy
    environment:
      HATIALERT_DOMAIN: ${HATIALERT_DOMAIN:?Set HATIALERT_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
      HATIALERT_UPSTREAM: hatialert:8000
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates and keys: keep this volume
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    logging: *logging

volumes:
  hatialert_data:
  caddy_data:
  caddy_config:
